<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Inventory & ML Demand Forecasting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg shadow-indigo-500/30 text-white">
        <i class="fa-solid fa-boxes-stacked text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 via-purple-300 to-cyan-400 bg-clip-text text-transparent">
          Inventory Management System
        </h1>
        <p class="text-xs text-slate-400">Demand Forecasting & Reorder Optimization</p>
      </div>
    </div>
    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> FastAPI Online
    </span>
  </header>

  <!-- Layout -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- Stats Overview Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target Product</span>
        <p id="cardProductId" class="text-2xl font-extrabold text-white mt-1">#1</p>
      </div>
      <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Stock</span>
        <p id="cardStock" class="text-2xl font-extrabold text-slate-300 mt-1">--</p>
      </div>
      <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl shadow-sm">
        <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Predicted 7-Day Demand</span>
        <p id="cardDemand" class="text-2xl font-extrabold text-indigo-400 mt-1">--</p>
      </div>
      <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl shadow-sm">
        <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Recommended Reorder</span>
        <p id="cardReorder" class="text-2xl font-extrabold text-cyan-400 mt-1">--</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Control Panel -->
      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl space-y-6">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-indigo-400"></i> Forecast Parameters
        </h2>

        <div class="space-y-2">
          <label class="block text-sm font-medium text-slate-300">Product ID</label>
          <input id="productId" type="number" value="1" min="1" 
                 class="w-full bg-slate-950 border border-slate-700/60 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
        </div>

        <button onclick="fetchForecast()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-3 rounded-xl font-semibold transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Run ML Model Prediction
        </button>

        <div id="alertBox" class="hidden p-4 rounded-xl text-sm border"></div>
      </div>

      <!-- Analytics Chart -->
      <div class="lg:col-span-2 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-chart-area text-cyan-400"></i> Demand Forecast Trend (Next 7 Days)
          </h2>
        </div>
        <div id="forecastChart" class="w-full h-72"></div>
      </div>
    </div>

  </main>

  <script>
    let chart;

    async function fetchForecast() {
      const productId = document.getElementById('productId').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/forecast/recommend/${productId}`, { method: 'POST' });
        if (!res.ok) throw new Error('Backend returned status ' + res.status);

        const data = await res.json();

        // Update Stats Cards
        document.getElementById('cardProductId').innerText = `#${productId}`;
        document.getElementById('cardStock').innerText = data.current_stock ?? '--';
        document.getElementById('cardDemand').innerText = data.predicted_demand ?? data.total_predicted_demand ?? 0;
        document.getElementById('cardReorder').innerText = data.recommended_reorder ?? data.reorder_quantity ?? 0;

        // Render Alert Box
        alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-amber-500/10', 'border-amber-500/30', 'text-amber-400');
        if (data.alert_severity === 'CRITICAL' || data.alert_severity === 'HIGH') {
          alertBox.className = 'p-4 rounded-xl text-sm bg-red-500/10 border border-red-500/30 text-red-400 flex items-center gap-3';
          alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-lg"></i> <div><strong>Stock Alert:</strong> Critical inventory level! Reorder immediately.</div>`;
        } else {
          alertBox.className = 'p-4 rounded-xl text-sm bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-3';
          alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i> <div><strong>Healthy Inventory:</strong> Stock levels are within safe operating limits.</div>`;
        }

        renderChart(data.daily_forecasts || [10, 15, 12, 18, 24, 20, 16]);

      } catch (err) {
        alertBox.classList.remove('hidden');
        alertBox.className = 'p-4 rounded-xl text-sm bg-red-500/10 border border-red-500/30 text-red-400';
        alertBox.innerText = 'Failed to fetch recommendation from backend. Check Python console for logs.';
      }
    }

    function renderChart(dailyData) {
      const options = {
        chart: { type: 'area', height: 280, toolbar: { show: false }, background: 'transparent' },
        stroke: { curve: 'smooth', width: 3 },
        colors: ['#6366f1'],
        fill: { type: 'gradient', gradient: { opacityFrom: 0.45, opacityTo: 0.05 } },
        theme: { mode: 'dark' },
        grid: { borderColor: '#1e293b' },
        series: [{ name: 'Predicted Units', data: dailyData }],
        xaxis: { 
          categories: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'],
          labels: { style: { colors: '#94a3b8' } }
        },
        yaxis: { labels: { style: { colors: '#94a3b8' } } }
      };

      if (chart) chart.destroy();
      chart = new ApexCharts(document.querySelector("#forecastChart"), options);
      chart.render();
    }

    // Auto-load Product 1 on startup
    window.onload = fetchForecast;
  </script>
</body>
</html>
